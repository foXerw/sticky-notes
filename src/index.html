<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的便签</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📝 我的便签</h1>
            <div class="header-controls">
                <!-- 视图切换 -->
                <div class="view-toggle">
                    <button id="gridViewBtn" class="view-btn active" title="网格视图">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                    </button>
                    <button id="listViewBtn" class="view-btn" title="列表视图">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="3" y="4" width="18" height="4" rx="1"/>
                            <rect x="3" y="10" width="18" height="4" rx="1"/>
                            <rect x="3" y="16" width="18" height="4" rx="1"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- 标签过滤栏 -->
        <div class="tags-bar">
            <span class="tags-label">标签：</span>
            <button class="tag-btn active" data-tag="all">全部</button>
            <div id="tagsContainer" class="tags-list">
                <!-- 标签按钮动态生成 -->
            </div>
        </div>

        <!-- 便签容器 -->
        <main id="notesContainer" class="notes-grid">
            <!-- 便签动态生成 -->
        </main>

        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>暂无便签</p>
            <p class="hint">使用 <code>python scripts/add_note.py "内容"</code> 添加便签</p>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            <p>Powered by Sticky Notes</p>
        </footer>
    </div>

    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
